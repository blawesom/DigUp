# Linux, the platform the port is developed and verified on (macOS stays the Mac's own affair: the split
# keeps its code compiling wherever it's built, and the same tests run there with `swift test`).
name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (CPU, its own readers)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: The readers' libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ffmpeg libavformat-dev libavcodec-dev libavutil-dev libswscale-dev libswresample-dev \
            libarchive-dev libheif-dev libheif-examples libheif-plugin-x265 libheif-plugin-libde265 \
            libheif-plugin-dav1d libexif-dev libsqlite3-dev \
            libtesseract-dev tesseract-ocr tesseract-ocr-eng tesseract-ocr-fra
      - name: Swift 6.4
        run: |
          curl -sL https://download.swift.org/swift-6.4.0-release/ubuntu2404/swift-6.4.0-RELEASE/swift-6.4.0-RELEASE-ubuntu24.04.tar.gz \
            | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/swift-6.4.0-RELEASE-ubuntu24.04/usr/bin" >> "$GITHUB_PATH"
      - name: pdfium
        run: scripts/fetch-pdfium.sh
      - name: llama.cpp, CPU
        run: scripts/build-llama.sh
      - name: Test
        run: |
          swift test 2>&1 | tee /tmp/test.log
          status=${PIPESTATUS[0]}
          if [ "$status" != "0" ]; then
            grep -E "error:|✘|◇|signal|Test run with" /tmp/test.log | sed -n '1,60p' | while IFS= read -r line; do
              echo "::error::${line:0:220}"
            done
            exit "$status"
          fi
